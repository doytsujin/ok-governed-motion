# Build the page and publish it to GitHub Pages.
#
# ## What gets served
#
# The site is an artifact, not a directory in this repository. `web/dist` is
# git-ignored and built here by wasm-pack, tsc and vite, then uploaded. Pages
# is configured with GitHub Actions as its source rather than a branch, because
# there is no committed index.html for a branch deploy to find.
#
# ## Publishing is now decided
#
# This was `workflow_dispatch` only while it was still an open question whether
# the contents should be reachable from a public URL. That question is settled
# and the site is live, so pushes to main republish it. The manual trigger is
# kept for redeploying without a commit.
#
# The page is a simulation and says so in its own header. That disclaimer is
# load-bearing now that this is public: it models an architecture and measures
# nothing about a physical system.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pages-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # Tests run before anything is published. Deploying a build whose tests
      # failed is worse than not deploying.
      - name: Test
        run: cargo test --workspace --release

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Report the payload
        run: |
          du -sh web/dist
          find web/dist -type f -size +200k -exec ls -lh {} \;

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
